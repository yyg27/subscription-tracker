<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Ana Fosforlu Yeşil Kredi Kartı Gövdesi -->
  <rect x="5" y="20" width="90" height="60" rx="10" fill="#9ef54c" />
  
  <!-- Siyah Manyetik Şerit -->
  <rect x="5" y="35" width="90" height="12" fill="#111" />
  
  <!-- Siyah Çip (Sol Alt) -->
  <rect x="15" y="55" width="18" height="14" rx="3" fill="#111" />
  
  <!-- Kart Numarası ve İsim Çizgileri -->
  <rect x="40" y="58" width="45" height="4" rx="2" fill="#111" opacity="0.6" />
  <rect x="40" y="66" width="30" height="4" rx="2" fill="#111" opacity="0.6" />
</svg>
